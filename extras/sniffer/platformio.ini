; CAN sniffer and CAN + UART recorder: LISTEN ONLY.
; One PlatformIO project, two programs (environments):
;   sniffer   - CAN frames only                          (src/sniffer/main.cpp)
;   recorder  - CAN frames + two UART lines (box <-> radio) on one clock (src/recorder/main.cpp)
; Board: ESP32-S3 dev board with module ESP32-S3-WROOM-1-N16R8 (16 MB flash, 8 MB PSRAM).
; Pins: include/board_pins.h.
;
; ARDUINO_USB_MODE=1 + ARDUINO_USB_CDC_ON_BOOT=1: "Serial" uses the native USB of the S3
; (no UART bridge, no baud rate limit).
;
; Build:   uvx platformio run -d extras/sniffer
; Upload:  uvx platformio run -d extras/sniffer -e sniffer -t upload

[platformio]
src_dir = src
include_dir = include
default_envs = sniffer, recorder

[env]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:sniffer]
build_src_filter = +<sniffer/>

[env:recorder]
build_src_filter = +<recorder/>
