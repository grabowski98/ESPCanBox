blank_issues_enabled: false
# Links shown next to the issue templates (GitHub docs: "Configuring issue templates for your
# repository", config.yml with contact_links). There is no documentation site (no Pages workflow
# in .github/workflows), so the documentation link points to the docs in the repository.
contact_links:
  - name: Security problem
    url: https://github.com/grabowski98/ESPCanBox/security/policy
    about: Do not post security details in a public issue. Read the security policy first.
  - name: Documentation
    url: https://github.com/grabowski98/ESPCanBox/tree/main/docs/en
    about: Quick start, safety, make it yours, troubleshooting.
