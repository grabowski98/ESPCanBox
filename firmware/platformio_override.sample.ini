; Local PlatformIO settings that stay out of the repository.
; Copy this file to platformio_override.ini (listed in .gitignore); platformio.ini loads it through
; extra_configs. Nothing here changes what the device may send: modes stay in src/config.h.
;
; Example: your own board without editing src/. Put boards/board_mine.h next to the others
; (start from boards/board_template.h) and build with:  uvx platformio run -e listen_mine

[env:listen_mine]
extends = env:listen
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -I include
    -I boards
    -DBOARD=CUSTOM
    '-DBOARD_CUSTOM_HEADER="board_mine.h"'

; Example: your own car profile without editing src/ (listen only). Copy lib/car_example to lib/car_mine,
; rename the files and the object (profile_mine.h, kCarMine), set "name": "car_mine" in
; lib/car_mine/library.json (lib_deps finds the library by that name), then:  uvx platformio run -e listen_mycar
; lib_deps is needed: the library finder does not follow the include through a macro in src/config.h.
[env:listen_mycar]
extends = env:listen_wifi
lib_deps = car_mine
build_flags =
    ${env:listen_wifi.build_flags}
    -DCAR_PROFILE=CUSTOM
    '-DCAR_PROFILE_CUSTOM_HEADER="profile_mine.h"'
    -DCAR_PROFILE_CUSTOM_OBJECT=kCarMine

; Example: your own radio protocol without editing src/ (listen only on CAN). Copy lib/radio_example to
; lib/radio_mine, rename the files and the object (protocol_mine.h, kRadioMine), set "name": "radio_mine" in
; lib/radio_mine/library.json, replace the invented framing and frames with your radio's, then:
;   uvx platformio run -e decoder_myradio
[env:decoder_myradio]
extends = env:decoder
lib_deps = radio_mine
build_flags =
    ${env:decoder.build_flags}
    -DRADIO_PROTOCOL=CUSTOM
    '-DRADIO_PROTOCOL_CUSTOM_HEADER="protocol_mine.h"'
    -DRADIO_PROTOCOL_CUSTOM_OBJECT=kRadioMine

; Check that an unfilled template stops the build with a readable message (expected: error).
[env:board_template_check]
extends = env:listen
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -I include
    -I boards
    -DBOARD=TEMPLATE
