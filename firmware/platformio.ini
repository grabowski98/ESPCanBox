; ESPCanBox: firmware for the ESP32-S3-DEV-KIT-N16R8 module (Waveshare).
; Six environments. Five (listen, decoder, listen_wifi, decoder_wifi, listen_generic_wifi): CAN bus
; LISTEN ONLY, the program contains no transmit function (check: tools/check_no_can_tx.sh).
; The sixth (decoder_tx_wifi): can transmit only the frames of the car profile's allow list (PSA AEE2010: 15B;
; 1A9 only with -DCAN_TX_EXPERIMENTAL=1), after arming ("cantx on").
; ARDUINO_USB_MODE=1 + ARDUINO_USB_CDC_ON_BOOT=1: "Serial" goes over the native USB of the S3 chip.
;
; Note: any change to this file wipes the build directory (everything is rebuilt from scratch).
; The program version number is in src/version.h, not here.

; A bare "pio run -t upload" without -e always flashes the safe "beside the box" mode without network.
[platformio]
default_envs = listen
; Optional local settings (e.g. your own board): copy platformio_override.sample.ini to
; platformio_override.ini (not tracked). A missing file is ignored.
extra_configs = platformio_override.ini

[env:listen]
; (name up to firmware 1.0.0: centralka)
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
monitor_speed = 115200
; Libraries in lib/ (no hardware): core, car_psa_aee2010, car_generic, radio_xp, radio_none, app
; (layers: tools/check_layering.py). The default library dependency finder (LDF, mode chain) finds them from
; the #include lines in src/ (checked by compiling the environments), so no lib_deps are needed.
; lib/car_example and lib/radio_example are templates for the host tests only: never compiled into the firmware.
lib_ignore = car_example, radio_example
; Car profile and radio protocol: -DCAR_PROFILE=PSA_AEE2010|GENERIC|CUSTOM and -DRADIO_PROTOCOL=XP|NONE|CUSTOM
; (src/config.h).
; Not given = PSA_AEE2010 and XP (the reference pair); only listen_generic_wifi below sets them.
; "-I include": include/project_identity.h (project name from project.json) is also visible to the libraries.
; "-I boards" + -DBOARD: pin header of the board (boards/board_proto_v1.h = prototype v1); see src/config.h.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -I include
    -I boards
    -DBOARD=PROTO_V1
; No network: the src/net directory is not compiled at all (nothing Wi-Fi related gets into the program).
; No transmit: the src/can_tx directory (the only place with twai_transmit) is not compiled at all.
build_src_filter = +<*> -<net/> -<can_tx/>
; Build time shown in "ver" and in the panel ("Built"): tools/build_time.py recompiles version.cpp
; whenever anything changed in src/, lib/ or web/.
extra_scripts = pre:tools/build_time.py

; Decoder mode: the device INSTEAD OF the box. Sends frames to the radio and drives the 12 V outputs
; (ACC, illumination, reverse). On the car CAN still listen only.
; Flash only on the bench or when the factory box does not transmit on the radio data line.
[env:decoder]
; (name up to firmware 1.0.0: centralka_dekoder)
extends = env:listen
build_flags =
    ${env:listen.build_flags}
    -DWORK_MODE=MODE_DECODER

; With network: web service panel and firmware update over Wi-Fi (src/net/net.h).
; Over Wi-Fi a different program can be flashed (images are not signed). A hardware guarantee of no
; transmission was given only by an open CAN transmitter jumper (JP1 on the prototype, JP_TX on the target board).
; Since 17.11.2026 JP1 on the prototype is closed and SLNT is wired to GPIO6: whether anything is
; transmitted on the car bus is decided only by the flashed program (in this environment: listen only).
; The tools/embed_web.py script packs the panel (web/) into a header in the build directory before compiling.
[env:listen_wifi]
; (name up to firmware 1.0.0: centralka_wifi)
extends = env:listen
build_flags =
    ${env:listen.build_flags}
    -DNET_ENABLED=1
build_src_filter = +<*> -<can_tx/>
; A key in an environment with "extends" replaces the inherited one, hence build_time.py is repeated.
extra_scripts =
    pre:tools/build_time.py
    pre:tools/embed_web.py

; Decoder with network. The same note about the CAN transmitter jumper as above; on CAN listen only.
[env:decoder_wifi]
; (name up to firmware 1.0.0: centralka_dekoder_wifi)
extends = env:listen_wifi
build_flags =
    ${env:listen_wifi.build_flags}
    -DWORK_MODE=MODE_DECODER

; Decoder with network AND WITH TRANSMISSION ON THE CAR CAN (CAN_TX_MODE = CAN_TX_SETTINGS, see src/config.h).
; The only environment in which src/can_tx/ (twai_transmit) is compiled. The program can transmit only
; the frames of the car profile's transmit allow list (lib/car_psa_aee2010/tx_allowlist.cpp: frame 15B,
; personalisation change in the BSI), after arming with the "cantx on" command and a restart;
; without arming it works like decoder_wifi (controller in listen-only mode, SLNT high).
; CAN_TX_EXPERIMENTAL=0: the trial frame 1A9 (screen buttons: parking sensors, blind spot) is NOT in the list.
; Setting 1 adds it: only in your own platformio_override.ini, deliberately.
; The build stops (src/config.h) with a profile whose allow list is empty and with CAR_PROFILE=GENERIC.
; Marker canTx = 1 in the image: an update from a program without transmission requires a separate consent.
; NOT the default environment; flashed only by the owner, deliberately.
[env:decoder_tx_wifi]
; (name up to firmware 1.0.0: centralka_dekoder_tx_wifi)
extends = env:decoder_wifi
build_flags =
    ${env:decoder_wifi.build_flags}
    -DCAN_TX_MODE=CAN_TX_SETTINGS
    -DCAN_TX_EXPERIMENTAL=0
build_src_filter = +<*>

; Unknown car, listen only, with network: car profile "generic" (decodes nothing, no keys, empty
; transmit allow list, 12 V outputs never on) and radio "none" (no UART). The starting point for another car:
; record its bus over USB ("dump") or in the panel. Bus speed: lib/car_generic/profile_generic.cpp
; (125 kbit/s by default; set the measured speed of your car). No transmission: src/can_tx/ is not compiled.
[env:listen_generic_wifi]
extends = env:listen_wifi
build_flags =
    ${env:listen_wifi.build_flags}
    -DCAR_PROFILE=GENERIC
    -DRADIO_PROTOCOL=NONE
